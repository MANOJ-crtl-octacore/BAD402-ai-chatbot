<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberMentor AI</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Marked JS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0b1020;
            color:white;
            height:100vh;
            overflow:hidden;
        }

        .container{
            display:flex;
            flex-direction:column;
            height:100vh;
        }

        /* Header */

        .header{
            background:#111827;
            padding:18px;
            border-bottom:1px solid #1f2937;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-size:24px;
            font-weight:700;
            color:#00ffae;
        }

        .subtitle{
            font-size:13px;
            color:#9ca3af;
        }

        .clear-btn{
            background:#ef4444;
            border:none;
            color:white;
            padding:10px 16px;
            border-radius:10px;
            cursor:pointer;
            font-weight:600;
            transition:0.3s;
        }

        .clear-btn:hover{
            background:#dc2626;
        }

        /* Chat Area */

        .chat-container{
            flex:1;
            overflow-y:auto;
            padding:20px;
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .message{
            max-width:80%;
            padding:15px;
            border-radius:18px;

            animation:fadeIn 0.3s ease;
            word-wrap:break-word;
        }

        .user-message{
            align-self:flex-end;
            background:#2563eb;
            border-bottom-right-radius:5px;
        }

        .bot-message{
            align-self:flex-start;
            background:#1f2937;
            border-bottom-left-radius:5px;
        }

        /* Input Area */

        .input-area{
            padding:20px;
            background:#111827;
            border-top:1px solid #1f2937;
            display:flex;
            gap:15px;
        }

        .input-box{
            flex:1;
            padding:15px;
            border:none;
            outline:none;
            border-radius:15px;
            background:#1f2937;
            color:white;
            font-size:16px;
        }

        .send-btn{
            background:#00ffae;
            color:black;
            border:none;
            padding:0 25px;
            border-radius:15px;
            cursor:pointer;
            font-weight:700;
            transition:0.3s;
        }

        .send-btn:hover{
            background:#00d392;
        }

        /* Typing */

        .typing{
            display:flex;
            gap:5px;
            padding:10px 15px;
            background:#1f2937;
            border-radius:15px;
            width:fit-content;

        .dot{
            width:8px;

    </style>

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div>
                <div class="logo">CyberMentor AI</div>
                <div class="subtitle">
                    Your Cybersecurity Learning Assistant
                </div>
            </div>

            <button class="clear-btn" onclick="clearChat()">
                Clear Chat
            </button>

        </div>

        <!-- Chat Messages -->

        <div class="chat-container" id="chatContainer">

            <div class="message bot-message">
                👋 Hello! I am CyberMentor AI.<br><br>
                Ask me anything about:
                <br><br>
                • Ethical Hacking<br>
                • Networking<br>
                • Kali Linux<br>
                • Web Security<br>
                • Bug Bounty<br>
                • Cybersecurity Careers
            </div>

        </div>

        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                class="input-box"
                placeholder="Ask your cybersecurity question..."
                autocomplete="off"
            >

            <button class="send-btn" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script>

        const userInput = document.getElementById("userInput");
        const chatContainer = document.getElementById("chatContainer");

        // Enter key support

        userInput.addEventListener("keypress", function(event){

            if(event.key === "Enter"){
                sendMessage();
            }

        });

        // Add message

        function addMessage(message, className){

            const messageDiv = document.createElement("div");

            messageDiv.classList.add("message", className);

            messageDiv.innerHTML = message;

            chatContainer.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Typing animation

        function showTyping(){

            const typingDiv = document.createElement("div");

            typingDiv.classList.add("typing");

            typingDiv.id = "typing";

            typingDiv.innerHTML = `
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            `;

            chatContainer.appendChild(typingDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping(){

            const typing = document.getElementById("typing");

            if(typing){
                typing.remove();
            }

        }

        // Send Message

        async function sendMessage(){

            const message = userInput.value.trim();

            if(message === ""){
                return;
            }

            addMessage(message, "user-message");

            userInput.value = "";

            showTyping();

            try{

                const response = await fetch("/chat", {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        message:message
                    })

                });

                const data = await response.json();

                removeTyping();

                addMessage(data.reply, "bot-message");

            }
            catch(error){

                removeTyping();

                addMessage(
                    "Error connecting to server.",
                    "bot-message"
                );

            }

        }

        // Clear Chat

        async function clearChat(){

            await fetch("/clear", {
                method:"POST"
            });

            location.reload();

        }

    </script>

</body>
</html>
